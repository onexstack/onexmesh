syntax = "proto3";

package helloworld;

option go_package = "github.com/onexstack/onexmesh/examples/helloworld/proto;helloworld";

// Greeter is a minimal demonstration service.
service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
